<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Level - Robbo</title>
    <script src="js/common.js" type="text/javascript"></script>
    <script src="js/objects.js" type="text/javascript"></script>
    <script src="js/keyboard.js" type="text/javascript"></script>
    <script src="js/ascii.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>
    <script src="js/parseMaps.js" type="text/javascript"></script>
    <script src="js/levels.js" type="text/javascript"></script>
    <script type="text/javascript">
        if( 'ascii' in R.getLocationHash() ){
            R.include(['js/asciiRender.js']);
        }else{
            R.include(['js/sprites.js']);
        }
    </script>

    <style>
        canvas {
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: -o-crisp-edges;
            image-rendering: optimize-contrast;
            -ms-interpolation-mode: nearest-neighbor;
        }
        body {
            max-width: 1200px;
            overflow: hidden;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 0;
            color: #999;
            background: #101010;
            font-family: monospace;
        }
        .h1 {
            font-size: 24px;
            text-align: center;
            color: #6af;
            padding: 20px;
        }
        #game {
            margin: 10px auto;
            text-align: center;
        }
        .controls {
            text-align: center;
            padding: 20px;
        }
        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
        }
        button:hover {
            background: #444;
            border-color: #6af;
        }
        .info {
            text-align: center;
            padding: 10px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="h1">🎮 Testing Custom Level</div>
    
    <div class="controls">
        <button onclick="window.close()">← Back to Editor</button>
        <button onclick="location.reload()">🔄 Restart</button>
    </div>
    
    <div id="game"></div>
    
    <div class="info">
        Use Arrow Keys to move | X to shoot | ESC to pause
    </div>

    <script type="text/javascript">
        // Load test level from localStorage
        const testLevelData = localStorage.getItem('robbo_test_level');
        
        if (!testLevelData) {
            document.body.innerHTML = '<div class="h1">❌ No test level found</div><div class="info">Please create a level in the editor first.</div>';
        } else {
            try {
                const testLevel = JSON.parse(testLevelData);
                
                window.Ro = new Robbo({
                    renderTo: document.getElementById('game'),
                    maps: [testLevel],
                    load: 0
                });
            } catch (e) {
                document.body.innerHTML = '<div class="h1">❌ Error loading test level</div><div class="info">' + e.message + '</div>';
            }
        }
    </script>
</body>
</html>
