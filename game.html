<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <script src="js/shim.js" type="text/javascript"></script>
    <script src="js/base.js" type="text/javascript"></script>

    <script src="js/common.js" type="text/javascript"></script>
    <script src="js/objects.js" type="text/javascript"></script>
    <script src="js/keyboard.js" type="text/javascript"></script>
    <script src="js/ascii.js" type="text/javascript"></script>
    <script src="js/controller.js" type="text/javascript"></script>
    <script src="js/parseMaps.js" type="text/javascript"></script>
    <script src="js/levels.js" type="text/javascript"></script>
    <script type="text/javascript">
        if( 'ascii' in R.getLocationHash() ){
            R.include(['js/asciiRender.js']);
        }else{
            R.include(['js/sprites.js']);
        }
    </script>

    <style>
        canvas {
            image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;

        image-rendering: -o-crisp-edges;
        image-rendering: optimize-contrast;
    -ms-interpolation-mode: nearest-neighbor;
            }
        body {
            max-width: 704px;
            overflow: hidden;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 0;
            color: #999;
            background: #101010;
            font-family: monospace;
        }
        .h1 {
            font-size: 24px;
        }
        .padding {
            padding-left: 20px;
        }
        .h0 {
            font-size: 128px;
            padding: 0px 32px;
            text-align: center;
            color: #666
        }
        #game {
            margin: 10px 0;
        }
        .centered {
            max-width: 192px;
            min-width: 192px;
            text-align: center;
        }
        .padding {
            padding-left: 20px;
        }
        .playAgain {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            text-align: center;
            font-size: 64px;
            cursor: pointer;
            border-bottom: 3px dotted transparent;
            padding-bottom: 20px;
            opacity: 0;
            transition: all ease-in-out 0.5s;
        }
        .playAgain.playAgain-visible {
            opacity: 1;
        }

        .playAgain:hover {
            border-bottom: 3px dotted
        }
    </style>
    <title>Robbo</title>
</head>
<body>

    <script src="js/log.js" type="text/javascript"></script>
    <div class="h0">ROBBO</div>
    <div id="game"></div>
<div>

  <div class="h1" style="margin:32px">Game controls:</div>

  <div style="display:flex;align-items: center;">
    <div>
      <div class="padding centered"><b>&uarr;</b></div>
      <div class="padding centered"><b>W</b></div>
      <div class="padding centered"><b>&larr; A</b> movement<b> D &rarr;</b></div>
      <div class="padding centered"><b>S</b></div>
      <div class="padding centered"><b>&darr;</b></div>
    </div>

    <div class="padding"  style="margin:32px">If you have got bullets — press <b>Shift</b> and choose the direction with arrows or WASD</div>
  </div>

</div>
<div id='log' style='position:fixed;bottom:0; background:#a00;color:#000;opacity:0.8;width:100%;left:0'></div>
    <script type="text/javascript">
        window.Ro = new Robbo({
            renderTo: document.getElementById('game'),
            maps: R.parseMaps(R.levelsData),
            load: (R.getLocationHash().level || 1)|0
        });
    </script>
</body>
</html>
